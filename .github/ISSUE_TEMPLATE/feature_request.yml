name: Feature request
description: Propose an improvement and explain the problem it solves
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the user and workflow affected. Search existing issues first.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Explain the desired outcome and how you would know it works.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Current workaround and alternatives
      description: Include simpler alternatives or explain why the current behavior is insufficient.
  - type: textarea
    id: impact
    attributes:
      label: Compatibility and scope
      description: Note any API, database, site-isolation or hosting implications you know about. Do not include private data.
